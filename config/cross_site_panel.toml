# Cross-site planning-stage panel config — cross_site_planning_panel.png
#
# Consumed by scripts/make_cross_site_panel.jl. Paths are resolved relative to
# THIS file's directory (config/), matching config/run_durham.toml.
#
# Each [[site]] becomes one row; the three columns are:
#   (a) col_a — RGB orthomosaic with k-medoids vegetation-cluster overlay
#               → an image PNG/JPG (a screenshot, or a pre-rendered
#                 output/<site>/cluster/cluster_overlay_k*.png from the pipeline)
#   (b) col_b — Epanechnikov KDE normalised planning surface
#               → an image PNG/JPG (output/<site>/kde/kde_density_heatmap.png),
#                 a co-registered .tif KDE surface (needs ArchGDAL), OR a
#                 headerless CSV grid of [0,1] density values
#   (c) col_c — boustrophedon waypoint plan coloured by 2–8 m/s target speed
#               → a waypoint CSV with x / y / speed columns (see col_c_*cols),
#                 OR a fallback image
#
# Leave any col_* = "" (or point at a missing file) to get a clearly-marked
# "pending" placeholder cell — the figure still composes so you can drop in
# Site B/C/D screenshots incrementally.

speed_min      = 2.0        # shared colorbar lower bound (m/s)
speed_max      = 8.0        # shared colorbar upper bound (m/s)
speed_colormap = "cividis"  # matches src/reports.jl report_speed_map
kde_colormap   = "viridis"  # matches src/reports.jl report_kde_density

# ── Row 1: Durham, NH (primary study site) ─────────────────────────────────
# Column (c) uses the REAL bundled density-aware waypoints (GridX,GridY,Height,
# Speed). Columns (a)/(b) point at pipeline outputs — run
#   julia --project=. scripts/run_pipeline.jl config/run_durham.toml
# to generate them (they render as placeholders until then, since the
# full-resolution Durham ortho is not bundled).
[[site]]
name           = "Durham, NH"
col_a          = "../output/durham/cluster/cluster_overlay_k1.png"
col_b          = "../output/durham/kde/kde_density_heatmap.png"
col_c          = "../data/ground_truth/E_density_aware__waypoints_xy.csv"
col_c_xcol     = "GridX"
col_c_ycol     = "GridY"
col_c_speedcol = "Speed"

# ── Row 2: Site B (PLACEHOLDER — point at your uploaded screenshots) ────────
[[site]]
name  = "Site B"
col_a = ""   # e.g. "../data/site_b/rgb_kmedoids_overlay.png"
col_b = ""   # e.g. "../data/site_b/kde_surface.png"
col_c = ""   # e.g. "../data/site_b/waypoints_xy_speed.csv" (x,y,speed cols)

# ── Row 3: Site C (PLACEHOLDER) ─────────────────────────────────────────────
[[site]]
name  = "Site C"
col_a = ""
col_b = ""
col_c = ""

# ── Row 4: Site D (PLACEHOLDER) ─────────────────────────────────────────────
[[site]]
name  = "Site D"
col_a = ""
col_b = ""
col_c = ""
