# Cross-site planning-stage panel config — cross_site_planning_panel.png
#
# Consumed by TWO scripts:
#   • scripts/preprocess_site_image.jl  — runs the k-medoids → KDE →
#     2–8 m/s → boustrophedon pipeline on each site's `image` and writes the
#     column (a)/(b)/(c) artefacts under output/<slug>/.
#   • scripts/make_cross_site_panel.jl  — composes the 4×3 figure from the
#     per-site col_* paths below.
#
# Paths are resolved relative to THIS file's directory (config/), matching
# config/run_durham.toml.
#
# Columns:
#   (a) col_a         — RGB screenshot (raw). If col_a_overlay is set AND the
#                       file exists, the k-medoids vegetation-cluster overlay is
#                       shown instead of the raw screenshot.
#   (b) col_b         — Epanechnikov KDE normalised planning surface (PNG, a
#                       headerless CSV grid, or a co-registered .tif).
#   (c) col_c         — boustrophedon waypoints coloured by 2–8 m/s target speed
#                       (a waypoint CSV with x/y/speed columns, or a fallback
#                       image). Set `provisional = true` to stamp the cell as
#                       image-space / not surveyed-metric.
#
# Leave any col_* = "" (or point at a missing file) to get a clearly-marked
# "pending" placeholder cell so the figure still composes incrementally.

speed_min      = 2.0        # shared colorbar lower bound (m/s)
speed_max      = 8.0        # shared colorbar upper bound (m/s)
speed_colormap = "cividis"  # matches src/reports.jl report_speed_map
kde_colormap   = "viridis"  # matches src/reports.jl report_kde_density

# ── Shared preprocessing defaults (used by preprocess_site_image.jl) ────────
# Override any of these per-[[site]].
seed                   = 6213
nsample                = 2000
kmedoids_k_range       = [2, 8]
tree_labels            = [1]     # DEFAULT ONLY — review per site (snow/illum!)
track_spacing_m        = 40.0    # metric flight-line spacing (metric mode only)
min_waypoint_spacing_m = 10.0
max_waypoint_spacing_m = 30.0

# ── Row 1: Durham, NH (primary study site) ─────────────────────────────────
# Column (c) uses the REAL bundled density-aware waypoints (GridX,GridY,Height,
# Speed) — a genuine metric plan. Columns (a)/(b) point at pipeline outputs;
# run  julia --project=. scripts/run_pipeline.jl config/run_durham.toml  to
# generate them (they render as placeholders until then).
[[site]]
name           = "Durham, NH"
col_a          = "../output/durham/cluster/cluster_overlay_k1.png"
col_b          = "../output/durham/kde/kde_density_heatmap.png"
col_c          = "../data/ground_truth/E_density_aware__waypoints_xy.csv"
col_c_xcol     = "GridX"
col_c_ycol     = "GridY"
col_c_speedcol = "Speed"
provisional    = false

# ── Row 2: OxBow Farm ───────────────────────────────────────────────────────
# Non-georeferenced JPEG screenshot (1328×1080). No CRS/GSD in the JPEG.
# The JPEG is a DISPLAY-RESAMPLED view of a source orthomosaic that is
# 11427×9281 px (W×H). The x and y resample factors DIFFER
# (11427/1328 ≈ 8.60 vs 9281/1080 ≈ 8.59), so a single isotropic factor is
# wrong — `source_width_px`/`source_height_px` expose both axes independently.
# METRIC PROCESSING IS DISABLED until the source GeoTIFF geotransform is
# supplied via `geotiff` (extract/verify it with scripts/inspect_geotiff.jl).
# Until then the row stays image-space / provisional = true.
[[site]]
name                     = "OxBow Farm"
image                    = "../data/site_images/oxbow_farm.jpg"
geotiff                  = ""        # ← set to the source ortho .tif to enable metric mode
source_width_px          = 11427     # source orthomosaic width  (px)
source_height_px         = 9281      # source orthomosaic height (px)
assume_durham_native_gsd = false     # disabled: JPEG is display-resampled (anisotropic)
tree_labels              = [1]      # ← REVIEW cluster_overlay_k*.png, then set
col_a                    = "../data/site_images/oxbow_farm.jpg"
col_a_overlay            = "../output/oxbow_farm/cluster/cluster_overlay_k1.png"
col_b                    = "../output/oxbow_farm/kde/kde_density_heatmap.png"
col_c                    = "../output/oxbow_farm/waypoints/oxbow_farm_waypoints_xy_speed.csv"
col_c_xcol               = "x"
col_c_ycol               = "y"
col_c_speedcol           = "speed"
provisional              = true

# ── Row 3: Hubbard Brook ─────────────────────────────────────────────────────
# Screenshot 1212×1080; source ortho 12609×9811 px (W×H). Resample factors are
# strongly anisotropic (12609/1212 ≈ 10.40 vs 9811/1080 ≈ 9.08). Metric mode
# disabled until `geotiff` is provided.
[[site]]
name                     = "Hubbard Brook"
image                    = "../data/site_images/hubbard_brook.jpg"
geotiff                  = ""
source_width_px          = 12609
source_height_px         = 9811
assume_durham_native_gsd = false
tree_labels              = [1]
col_a                    = "../data/site_images/hubbard_brook.jpg"
col_a_overlay            = "../output/hubbard_brook/cluster/cluster_overlay_k1.png"
col_b                    = "../output/hubbard_brook/kde/kde_density_heatmap.png"
col_c                    = "../output/hubbard_brook/waypoints/hubbard_brook_waypoints_xy_speed.csv"
col_c_xcol               = "x"
col_c_ycol               = "y"
col_c_speedcol           = "speed"
provisional              = true

# ── Row 4: Kingman Farm ──────────────────────────────────────────────────────
# Screenshot 1390×1080; source ortho 9916×8859 px (W×H). Resample factors are
# anisotropic (9916/1390 ≈ 7.13 vs 8859/1080 ≈ 8.20). Metric mode disabled
# until `geotiff` is provided.
[[site]]
name                     = "Kingman Farm"
image                    = "../data/site_images/kingman_farm.jpg"
geotiff                  = ""
source_width_px          = 9916
source_height_px         = 8859
assume_durham_native_gsd = false
tree_labels              = [1]
col_a                    = "../data/site_images/kingman_farm.jpg"
col_a_overlay            = "../output/kingman_farm/cluster/cluster_overlay_k1.png"
col_b                    = "../output/kingman_farm/kde/kde_density_heatmap.png"
col_c                    = "../output/kingman_farm/waypoints/kingman_farm_waypoints_xy_speed.csv"
col_c_xcol               = "x"
col_c_ycol               = "y"
col_c_speedcol           = "speed"
provisional              = true
