# col_b          = "../output/durham/kde/kde_density_heatmap.png"
# col_c          = "../data/ground_truth/E_density_aware__waypoints_xy.csv"
# col_c_xcol     = "GridX"
# col_c_ycol     = "GridY"
# col_c_speedcol = "Speed"
# provisional    = false

# ── Row 2: OxBow Farm ───────────────────────────────────────────────────────
# Preferred: set `geotiff` to the source ortho .tif — it becomes the
# AUTHORITATIVE RGB + transform/CRS source (native m/px from its geotransform;
# the JPEG and the source_*_px factors below are then IGNORED).
# Fallback (current): non-georeferenced JPEG screenshot (1328×1080), no CRS/GSD.
# The JPEG is a DISPLAY-RESAMPLED view of a 11427×9281 px (W×H) source ortho;
# the x/y resample factors DIFFER (11427/1328 ≈ 8.60 vs 9281/1080 ≈ 8.59), so
# `source_width_px`/`source_height_px` expose both axes independently. These are
# only used by the `assume_durham_native_gsd` fallback; without a `geotiff` the
# row stays image-space / provisional = true.
[[site]]
name                     = "OxBow Farm"
image                    = "../data/site_images/oxbow_farm.jpg"
